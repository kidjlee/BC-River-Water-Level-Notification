name: Probe feed conflict

on:
  workflow_dispatch:
    inputs:
      stations:
        description: "Space-separated station IDs (blank = notify rivers)"
        default: ""

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Compare feeds
        run: python tools/probe_conflict.py ${{ inputs.stations }}
