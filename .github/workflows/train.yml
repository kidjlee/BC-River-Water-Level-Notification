name: Train forecast + calibrate thresholds

# Heavy, occasional job (pulls decades of history). Runs weekly + on demand.
# Commits the trained models so the frequent check workflow can just load them.
on:
  schedule:
    - cron: "0 9 * * 1"     # Mondays 09:00 UTC
  workflow_dispatch:
    inputs:
      calibrate:
        description: "Also recalibrate thresholds from history (writes config)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    concurrency:
      group: main-writer      # shared with check.yml/bootstrap.yml so pushes never race
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      - name: Calibrate flat thresholds (optional)
        if: ${{ inputs.calibrate }}
        run: python tools/calibrate_thresholds.py --write

      - name: Refresh per-month thresholds (all rivers)
        run: python tools/calibrate_thresholds.py --monthly

      - name: Diagnose gauge quality
        run: python tools/diagnose.py || true

      - name: Refresh DFO regulations
        run: python tools/fetch_regulations.py || true

      - name: Backfill 1-year daily actuals
        run: python tools/backfill_actuals.py || true
      - name: Audit history coverage
        run: python tools/check_coverage.py || true

      - name: Commit models + thresholds
        run: |
          tools/commit_generated.sh "Refresh calibration, diagnostics, and 1-year actuals [skip ci]" \
            config/rivers.yaml \
            config/thresholds_monthly.json \
            config/diagnostics.json \
            config/regulations.json \
            data/actuals_daily.json
