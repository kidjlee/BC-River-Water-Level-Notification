name: Probe DFO restrictions page

# Manual helper: dump DFO's Region 2 freshwater fishing notice page as text.
# This sandbox blocks *.gc.ca outbound, so this has to run here and be read
# back from the job log.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "DFO notice page URL"
        default: "https://www.pac.dfo-mpo.gc.ca/fm-gp/rec/fresh-douce/region2-eng.html"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests beautifulsoup4 lxml
      - name: Fetch and dump
        run: python tools/probe_dfo_restrictions.py "${{ inputs.url }}"
