name: Probe one station

on:
  workflow_dispatch:
    inputs:
      args:
        description: "station [metric] [days]"
        default: "08MH002 level 10"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Probe station
        run: python tools/probe_station.py ${{ inputs.args }}
