name: Audit data accuracy

# Manual: compare published numbers with raw Water Office data, probe for
# water temperature, and list alternative gauges. Read-only.
on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python tools/audit_accuracy.py
