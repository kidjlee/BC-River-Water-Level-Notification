name: Refresh DFO regulations

# DFO's Region 2 notice carries in-season variations, so re-scrape it daily and
# commit the result. One request a day is polite to a free public service, and
# the hourly dashboard build just reads the committed file.
on:
  schedule:
    - cron: "40 13 * * *"     # daily, ~06:40 Pacific
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regulations:
    runs-on: ubuntu-latest
    concurrency:
      group: main-writer      # shared with check.yml so pushes never race
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Scrape DFO Region 2 notice
        run: python tools/fetch_regulations.py --dump
      - name: Rebuild dashboard
        run: python -m src.main --no-notify
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/regulations.json docs/index.html state/state.json data/actuals_daily.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Refresh DFO regulations [skip ci]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase origin main || git rebase --abort
            sleep $((i * 3))
          done
          exit 1
